[project]
name = "prd-agent-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.83,<2",
  "httpx>=0.28,<1",
  "protobuf>=7.35,<8",
]

[project.scripts]
prd-agent-agent-worker = "agent.worker_main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
