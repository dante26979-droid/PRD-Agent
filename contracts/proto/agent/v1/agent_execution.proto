syntax = "proto3";

package agent.v1;

option go_package = "github.com/dante26979-droid/prd-agent/contracts/gen/go/agent/v1;agentv1";

service AgentExecutionService {
	rpc AcquireRun(AcquireRunRequest) returns (AcquireRunResponse);
	rpc GetRunContext(GetRunContextRequest) returns (GetRunContextResponse);
	rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
	rpc RecordModelAttempt(RecordModelAttemptRequest) returns (RecordModelAttemptResponse);
	rpc AppendEvidence(AppendEvidenceRequest) returns (AppendEvidenceResponse);
	rpc SaveRunArtifact(SaveRunArtifactRequest) returns (SaveRunArtifactResponse);
	rpc SaveCheckpoint(SaveCheckpointRequest) returns (SaveCheckpointResponse);
	rpc SubmitDraft(SubmitDraftRequest) returns (SubmitDraftResponse);
	rpc SubmitRunOutput(SubmitRunOutputRequest) returns (SubmitRunOutputResponse);
	rpc CompleteRun(CompleteRunRequest) returns (CompleteRunResponse);
	rpc FailRun(FailRunRequest) returns (FailRunResponse);
}

message RequestMeta {
  string contract_version = 1;
  string request_id = 2;
  string correlation_id = 3;
}

message AcquireRunRequest {
  string run_id = 1;
  string worker_id = 2;
	string contract_version = 3;
	RequestMeta meta = 4;
}

message LeaseContext {
  string run_id = 1;
  string lease_id = 2;
	int64 fencing_token = 3;
	string expires_at = 4;
	string worker_id = 5;
}

message AcquireRunResponse { LeaseContext lease = 1; }

message GetRunContextRequest {
	string run_id = 1;
	LeaseContext lease = 2;
	RequestMeta meta = 3;
}

message AgentRunInput {
  string run_id = 1;
  string tenant_id = 2;
  string owner_id = 3;
  string task_id = 4;
  string task_message = 5;
  string workflow_version = 6;
	bytes checkpoint = 7;
	int64 checkpoint_sequence = 8;
	int64 task_version = 9;
	string repository_binding_id = 10;
	string repository_revision = 11;
	repeated EvidenceItem resume_evidence = 12;
	repeated RunArtifact resume_artifacts = 13;
	RevisionScope revision_scope = 14;
	SubmittedDraftReceipt resume_draft = 15;
	SubmittedDraftReceipt base_draft = 16;
	SubmittedDraftReceipt submitted_draft = 17;
	ResumeStateSummary resume_summary = 18;
	string execution_ledger_version = 19;
	RunBudget run_budget = 20;
	ConsumedBudget consumed_budget = 21;
	repeated RunLedgerEntry ledger_entries = 22;
	repeated SourceAuthority allowed_source_authorities = 23;
	RunPurpose run_purpose = 24;
	UnitScope unit_scope = 25;
	string evaluation_mode = 26;
	string authoritative_workflow_version = 27;
	string shadow_workflow_version = 28;
	string candidate_policy_version = 29;
	string assignment_hash = 30;
	string memory_space_id = 31;
	int64 memory_watermark = 32;
	string memory_policy_version = 33;
	string memory_access_scope_hash = 34;
	string memory_assignment_hash = 35;
}

enum RunPurpose {
	RUN_PURPOSE_UNSPECIFIED = 0;
	RUN_PURPOSE_PLAN_OUTLINE = 1;
	RUN_PURPOSE_GENERATE_UNIT = 2;
	RUN_PURPOSE_REVISE_UNIT = 3;
	RUN_PURPOSE_FULL_REVIEW = 4;
}

enum RunOutputKind {
	RUN_OUTPUT_KIND_UNSPECIFIED = 0;
	RUN_OUTPUT_KIND_OUTLINE_CANDIDATE = 1;
	RUN_OUTPUT_KIND_UNIT_CANDIDATE = 2;
	RUN_OUTPUT_KIND_UNIT_PATCH = 3;
	RUN_OUTPUT_KIND_FULL_REVIEW_REPORT = 4;
}

message ConfirmedUnitContext {
	string unit_key = 1;
	int64 unit_version = 2;
	string content_hash = 3;
	string summary = 4;
	string working_draft_ref = 5;
	string markdown = 6;
}

message UnitScope {
	string schema_version = 1;
	string outline_id = 2;
	int64 outline_version = 3;
	string outline_hash = 4;
	string current_unit_key = 5;
	string current_unit_title = 6;
	int32 current_unit_ordinal = 7;
	repeated string section_node_keys = 8;
	repeated string dependency_unit_keys = 9;
	repeated ConfirmedUnitContext confirmed_context = 10;
	repeated string reopened_unit_keys = 11;
	repeated string immutable_unit_keys = 12;
	string requirement_brief_ref = 13;
	string requirement_brief_hash = 14;
	string base_unit_hash = 15;
	string user_feedback = 16;
	string scope_hash = 17;
}

message SourceAuthority {
	string source_kind = 1;
	string binding_id = 2;
	string source_id = 3;
	string source_version = 4;
	string access_scope_hash = 5;
}

message RunBudget {
	int64 max_model_attempts = 1;
	int64 max_tool_calls = 2;
	int64 max_iterations = 3;
	int64 max_replans = 4;
	int64 max_supplements = 5;
	int64 max_quality_repairs = 6;
	int64 max_input_tokens = 7;
	int64 max_output_tokens = 8;
	int64 max_elapsed_ms = 9;
}

message BudgetDelta {
	int64 model_attempts = 1;
	int64 tool_calls = 2;
	int64 iterations = 3;
	int64 replans = 4;
	int64 supplements = 5;
	int64 quality_repairs = 6;
	int64 input_tokens = 7;
	int64 output_tokens = 8;
	int64 elapsed_ms = 9;
}

message ConsumedBudget {
	int64 model_attempts = 1;
	int64 tool_calls = 2;
	int64 iterations = 3;
	int64 replans = 4;
	int64 supplements = 5;
	int64 quality_repairs = 6;
	int64 input_tokens = 7;
	int64 output_tokens = 8;
	int64 elapsed_ms = 9;
}

message RunLedgerEntry {
	string entry_id = 1;
	string operation_key = 2;
	string entry_kind = 3;
	string operation = 4;
	string request_hash = 5;
	string status = 6;
	BudgetDelta reservation = 7;
	BudgetDelta consumption = 8;
	string output_artifact_key = 9;
	string output_artifact_hash = 10;
	repeated string evidence_refs = 11;
	string error_category = 12;
	bool retryable = 13;
}

message RunLedgerEvent {
	string event_type = 1;
	RunLedgerEntry entry = 2;
}

message GetRunContextResponse { AgentRunInput input = 1; }

message HeartbeatRequest {
  LeaseContext lease = 1;
  RequestMeta meta = 2;
}

message HeartbeatResponse { LeaseContext lease = 1; }

message RecordModelAttemptRequest {
  LeaseContext lease = 1;
  string attempt_key = 2;
  string operation = 3;
  string prompt_version = 4;
  string provider = 5;
  string request_hash = 6;
  string status = 7;
  string response_metadata_json = 8;
	string token_usage_json = 9;
	string error_category = 10;
	RequestMeta meta = 11;
}

message AttemptReceipt { string attempt_id = 1; }
message RecordModelAttemptResponse { AttemptReceipt receipt = 1; }

message AppendEvidenceRequest {
	LeaseContext lease = 1;
	repeated EvidenceItem items = 2;
	RequestMeta meta = 3;
}

message EvidenceItem {
  string source_type = 1;
  string source_id = 2;
  string locator = 3;
  string excerpt_hash = 4;
  string excerpt = 5;
	string source_kind = 6;
	string binding_id = 7;
	string source_version = 8;
	string access_scope_hash = 9;
	string outcome_kind = 10;
}

message EvidenceReceipt { int64 accepted_count = 1; }
message AppendEvidenceResponse { EvidenceReceipt receipt = 1; }

message RunArtifact {
	string artifact_key = 1;
	string artifact_type = 2;
	int64 generation = 3;
	string request_hash = 4;
	string content_hash = 5;
	bytes content = 6;
}

message RevisionScope {
	string base_draft_id = 1;
	string base_draft_hash = 2;
	repeated string reopened_unit_keys = 3;
	repeated string immutable_unit_keys = 4;
	string user_feedback = 5;
}

message SubmittedDraftReceipt {
	string draft_key = 1;
	string content_hash = 2;
	int64 task_version = 3;
	bytes content = 4;
}

message RunArtifactIdentity {
	string artifact_key = 1;
	string artifact_type = 2;
	int64 generation = 3;
	string request_hash = 4;
	string content_hash = 5;
}

message ResumeStateSummary {
	string checkpoint_content_hash = 1;
	int64 terminal_model_attempt_count = 2;
	int64 evidence_count = 3;
	repeated string evidence_refs = 4;
	int64 artifact_count = 5;
	repeated RunArtifactIdentity artifacts = 6;
}

message SaveRunArtifactRequest {
	LeaseContext lease = 1;
	RunArtifact artifact = 2;
	RequestMeta meta = 3;
}

message RunArtifactReceipt {
	string artifact_key = 1;
	string content_hash = 2;
}

message SaveRunArtifactResponse { RunArtifactReceipt receipt = 1; }

message SaveCheckpointRequest {
	LeaseContext lease = 1;
	int64 sequence = 2;
	bytes checkpoint = 3;
	RequestMeta meta = 4;
}

message CheckpointReceipt { int64 sequence = 1; string content_hash = 2; }
message SaveCheckpointResponse { CheckpointReceipt receipt = 1; }

message SubmitDraftRequest {
  LeaseContext lease = 1;
	int64 expected_task_version = 2;
	bytes draft_patch = 3;
	string draft_key = 4;
	RequestMeta meta = 5;
}

message DraftReceipt { int64 task_version = 1; }
message SubmitDraftResponse { DraftReceipt receipt = 1; }

message RunOutput {
	string schema_version = 1;
	string output_key = 2;
	RunOutputKind output_kind = 3;
	RunPurpose run_purpose = 4;
	string scope_hash = 5;
	int64 expected_task_version = 6;
	string content_hash = 7;
	bytes payload = 8;
}

message SubmitRunOutputRequest {
	LeaseContext lease = 1;
	RunOutput output = 2;
	RequestMeta meta = 3;
}

message RunOutputReceipt {
	string output_key = 1;
	string content_hash = 2;
	int64 task_version = 3;
}

message SubmitRunOutputResponse { RunOutputReceipt receipt = 1; }

message CompleteRunRequest {
	LeaseContext lease = 1;
	string result_type = 2;
	RequestMeta meta = 3;
}

message CompleteRunResponse { RunProjection projection = 1; }

message FailRunRequest {
  LeaseContext lease = 1;
  string error_category = 2;
	bool retryable = 3;
	RequestMeta meta = 4;
}

message FailRunResponse { RunProjection projection = 1; }

message RunProjection {
  string run_id = 1;
  string status = 2;
  int64 event_sequence = 3;
}
