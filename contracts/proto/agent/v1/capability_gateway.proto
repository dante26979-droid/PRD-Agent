syntax = "proto3";

package agent.v1;

import "agent/v1/agent_execution.proto";

option go_package = "github.com/dante26979-droid/prd-agent/contracts/gen/go/agent/v1;agentv1";

service CapabilityGatewayService {
	rpc ReadRepositoryTree(ReadRepositoryTreeRequest) returns (ReadRepositoryTreeResponse);
	rpc ReadRepositoryFile(ReadRepositoryFileRequest) returns (ReadRepositoryFileResponse);
	rpc SearchRepository(SearchRepositoryRequest) returns (SearchRepositoryResponse);
	rpc SearchPrdCatalog(SearchPrdCatalogRequest) returns (SearchPrdCatalogResponse);
	rpc FetchPrdSections(FetchPrdSectionsRequest) returns (FetchPrdSectionsResponse);
	rpc CreateExportIntent(CreateExportIntentRequest) returns (CreateExportIntentResponse);
	rpc SearchProjectMemory(SearchProjectMemoryRequest) returns (SearchProjectMemoryResponse);
}

message CapabilityLease {
  LeaseContext lease = 1;
  string contract_version = 2;
  RequestMeta meta = 3;
}

message ReadRepositoryTreeRequest {
  CapabilityLease capability = 1;
  string binding_id = 2;
  string revision = 3;
  string prefix = 4;
}

message RepositoryTree {
  repeated string paths = 1;
}

message ReadRepositoryTreeResponse { RepositoryTree tree = 1; }

message ReadRepositoryFileRequest {
  CapabilityLease capability = 1;
  string binding_id = 2;
  string revision = 3;
  string path = 4;
}

message RepositoryFile {
  string path = 1;
  bytes content = 2;
  string content_hash = 3;
}

message ReadRepositoryFileResponse { RepositoryFile file = 1; }

message SearchRepositoryRequest {
  CapabilityLease capability = 1;
  string binding_id = 2;
  string revision = 3;
  string query = 4;
  int32 limit = 5;
}

message RepositorySearchHit {
  string path = 1;
  int32 line = 2;
  string snippet = 3;
}

message SearchRepositoryResponse {
  repeated RepositorySearchHit hits = 1;
}

message SearchPrdCatalogRequest {
  CapabilityLease capability = 1;
  string query = 2;
  int32 limit = 3;
}

message PrdCatalogHit {
  string locator_id = 1;
  string source_revision = 2;
  string title = 3;
  string excerpt = 4;
}

message SearchPrdCatalogResponse {
  repeated PrdCatalogHit hits = 1;
}

message FetchPrdSectionsRequest {
  CapabilityLease capability = 1;
  repeated string locator_ids = 2;
}

message PrdSection {
  string locator_id = 1;
  string source_revision = 2;
  string title = 3;
  string markdown = 4;
}

message FetchPrdSectionsResponse {
  repeated PrdSection sections = 1;
}

message CreateExportIntentRequest {
  CapabilityLease capability = 1;
  string task_id = 2;
  int64 draft_version = 3;
}

message ExportIntentReceipt {
  string intent_id = 1;
  string confirmation_token = 2;
  string status = 3;
}

message CreateExportIntentResponse { ExportIntentReceipt receipt = 1; }

message SearchProjectMemoryRequest {
  CapabilityLease capability = 1;
  string query = 2;
  string operation = 3;
  repeated string memory_types = 4;
  repeated string tags = 5;
  int32 limit = 6;
}

message ProjectMemorySourceRef {
  string source_kind = 1;
  string binding_id = 2;
  string source_id = 3;
  string source_version = 4;
  string locator = 5;
  string content_hash = 6;
  string access_scope_hash = 7;
}

message ProjectMemoryItem {
  string memory_id = 1;
  int64 version = 2;
  string memory_type = 3;
  string subject = 4;
  string predicate = 5;
  string value_json = 6;
  string statement = 7;
  string authority_class = 8;
  repeated string tags = 9;
  string sensitivity = 10;
  repeated ProjectMemorySourceRef source_refs = 11;
  int64 committed_epoch = 12;
  string content_hash = 13;
}

message ProjectMemoryConflict {
  string conflict_id = 1;
  string subject = 2;
  string predicate = 3;
  repeated string memory_ids = 4;
}

message SearchProjectMemoryResponse {
  string space_id = 1;
  int64 memory_watermark = 2;
  repeated ProjectMemoryItem records = 3;
  repeated ProjectMemoryConflict conflicts = 4;
  int32 excluded_count = 5;
  string source_set_hash = 6;
}
