name: prd-agent-go-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prd_agent
      POSTGRES_USER: prd_agent
      POSTGRES_PASSWORD: prd_agent_local_only
    ports:
      - "15432:5432"
    volumes:
      - prd-agent-go-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prd_agent -d prd_agent"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory-policy
      - noeviction
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  go-migrate:
    build:
      context: ../..
      dockerfile: backend-go/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    entrypoint: ["/app/prd-agent-go-migrate"]
    environment:
      PRD_AGENT_DATABASE_DSN: postgres://prd_agent:prd_agent_local_only@postgres:5432/prd_agent?sslmode=disable
      PRD_AGENT_GO_MIGRATIONS_DIR: /app/db/migrations
    depends_on:
      postgres:
        condition: service_healthy

  go-api:
    build:
      context: ../..
      dockerfile: backend-go/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    environment:
      PRD_AGENT_ENVIRONMENT: local
      PRD_AGENT_GO_ALLOW_DEV_PRINCIPAL: "true"
      PRD_AGENT_GO_HTTP_ADDRESS: :8080
      PRD_AGENT_DATABASE_DSN: postgres://prd_agent:prd_agent_local_only@postgres:5432/prd_agent?sslmode=disable
      PRD_AGENT_BROKER_URL: redis://redis:6379/0
      PRD_AGENT_DEFAULT_WORKFLOW_VERSION: agent-runtime.v4
      PRD_AGENT_ROLLOUT_POLICY_VERSION: local-v4.1
      PRD_AGENT_V4_CANARY_BASIS_POINTS: "10000"
    depends_on:
      go-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "18080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/prd-agent-go-api", "healthcheck", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-agent:
    build:
      context: ../..
      dockerfile: agent-python/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      PRD_AGENT_ENVIRONMENT: test
      PRD_AGENT_AGENT_WORKER_ENDPOINT: :9100
      PRD_AGENT_AGENT_WORKER_ID: worker-1
      PRD_AGENT_AGENT_WORKER_MAX_INFLIGHT: "1"
      PRD_AGENT_AGENT_LOOP_FACTORY: agent.bootstrap:build_agent_loop
      PRD_AGENT_ADVANCED_LOOP_MODE: enforce
      PRD_AGENT_AGENT_RPC_TOKEN: prd-agent-local-rpc-token-32-bytes
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection=socket.create_connection(('127.0.0.1',9100),2); connection.close()"
      interval: 5s
      timeout: 3s
      retries: 10

  go-maintenance:
    build:
      context: ../..
      dockerfile: backend-go/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    entrypoint: ["/app/prd-agent-go-maintenance"]
    environment:
      PRD_AGENT_ENVIRONMENT: local
      PRD_AGENT_DATABASE_DSN: postgres://prd_agent:prd_agent_local_only@postgres:5432/prd_agent?sslmode=disable
      PRD_AGENT_BROKER_URL: redis://redis:6379/0
      PRD_AGENT_GO_AGENT_DISPATCH_MODE: go_rpc_pool
      PRD_AGENT_GO_AGENT_RPC_WORKER_ENDPOINTS: python-agent:9100
      PRD_AGENT_GO_AGENT_RPC_MAX_INFLIGHT_PER_WORKER: "1"
      PRD_AGENT_AGENT_RPC_TOKEN: prd-agent-local-rpc-token-32-bytes
      PRD_AGENT_GO_AGENT_DISPATCH_BATCH_SIZE: "10"
      PRD_AGENT_GO_MAINTENANCE_INTERVAL_SECONDS: "1"
      PRD_AGENT_DEFAULT_WORKFLOW_VERSION: agent-runtime.v4
      PRD_AGENT_ROLLOUT_POLICY_VERSION: local-v4.1
      PRD_AGENT_V4_CANARY_BASIS_POINTS: "10000"
    depends_on:
      go-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      python-agent:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        PRD_AGENT_API_ORIGIN: http://go-api:8080
    environment:
      PRD_AGENT_API_ORIGIN: http://go-api:8080
    depends_on:
      go-api:
        condition: service_healthy
    ports:
      - "13000:3000"
    restart: unless-stopped

volumes:
  prd-agent-go-postgres:
