services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prd_agent
      POSTGRES_USER: prd_agent
      POSTGRES_PASSWORD: prd_agent_local_only
    ports:
      - "5432:5432"
    volumes:
      - prd-agent-postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prd_agent -d prd_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prd-agent-postgres:
