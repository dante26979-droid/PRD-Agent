services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prd_agent
      POSTGRES_USER: prd_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.45"
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prd_agent -d prd_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    expose:
      - "6379"
    restart: unless-stopped
    mem_limit: 96m
    cpus: "0.10"
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /data:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options: {max-size: "10m", max-file: "3"}

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_dsn:
    file: ./secrets/database_dsn.txt
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  proxy_secret:
    file: ./secrets/proxy_secret.txt
  agent_rpc_token:
    file: ./secrets/agent_rpc_token.txt
  export_confirmation_secret:
    file: ./secrets/export_confirmation_secret.txt
  feishu_app_id:
    file: ./secrets/feishu_app_id.txt
  feishu_app_secret:
    file: ./secrets/feishu_app_secret.txt
  feishu_wiki_node_token:
    file: ./secrets/feishu_wiki_node_token.txt
  basic_auth_htpasswd:
    file: ./secrets/basic_auth.htpasswd
  tls_certificate:
    file: ./secrets/tls_certificate.pem
  tls_private_key:
    file: ./secrets/tls_private_key.pem
  backup_encryption_key:
    file: ./secrets/backup_encryption_key.txt

volumes:
  postgres-data:
