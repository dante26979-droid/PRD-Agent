x-application-environment: &application-environment
  PRD_AGENT_ENVIRONMENT: production
  PRD_AGENT_DATABASE_DSN_FILE: /run/secrets/database_dsn
  PRD_AGENT_BROKER_URL: redis://redis:6379/0
  PRD_AGENT_OIDC_ISSUER: ${PRD_AGENT_OIDC_ISSUER:?required}
  PRD_AGENT_OIDC_AUDIENCE: ${PRD_AGENT_OIDC_AUDIENCE:?required}
  PRD_AGENT_OIDC_JWKS_URL: ${PRD_AGENT_OIDC_JWKS_URL:?required}
  PRD_AGENT_CORS_ORIGINS: ${PRD_AGENT_CORS_ORIGINS:?required}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prd_agent
      POSTGRES_USER: prd_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prd_agent -d prd_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    command: ["prd-agent-migrate"]
    environment:
      PRD_AGENT_DATABASE_DSN_FILE: /run/secrets/database_dsn
    secrets:
      - database_dsn
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    environment:
      <<: *application-environment
      PRD_AGENT_LLM_PROVIDER: deepseek
      PRD_AGENT_LLM_BASE_URL: https://api.deepseek.com
      PRD_AGENT_LLM_MODEL: ${PRD_AGENT_LLM_MODEL:-deepseek-v4-pro}
      PRD_AGENT_LLM_API_KEY_FILE: /run/secrets/deepseek_api_key
      PRD_AGENT_LLM_TIMEOUT_SECONDS: ${PRD_AGENT_LLM_TIMEOUT_SECONDS:-90}
      PRD_AGENT_LLM_CONNECT_TIMEOUT_SECONDS: 5
      PRD_AGENT_LLM_MAX_OUTPUT_TOKENS: ${PRD_AGENT_LLM_MAX_OUTPUT_TOKENS:-4096}
      PRD_AGENT_LLM_MAX_ITERATIONS: ${PRD_AGENT_LLM_MAX_ITERATIONS:-8}
      PRD_AGENT_LLM_RUN_TOKEN_BUDGET: ${PRD_AGENT_LLM_RUN_TOKEN_BUDGET:-24000}
      PRD_AGENT_LLM_MAX_TRANSPORT_RETRIES: 2
      PRD_AGENT_LLM_ALLOWED_HOSTS: api.deepseek.com
    secrets:
      - database_dsn
      - deepseek_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"

  outbox-publisher:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    command: ["prd-agent-publisher", "--interval", "1"]
    environment: *application-environment
    secrets:
      - database_dsn
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  scheduler-reconciler:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    command: ["prd-agent-scheduler", "--interval", "5"]
    environment: *application-environment
    secrets:
      - database_dsn
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_dsn:
    file: ./secrets/database_dsn.txt
  deepseek_api_key:
    file: ./secrets/deepseek_api_key

volumes:
  postgres-data:
  redis-data:
